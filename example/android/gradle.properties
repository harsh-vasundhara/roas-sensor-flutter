# This builtInKotlin flag was added by the Flutter template.
#
# FALSE, and the reason has changed — verified by building, not assumed. The old
# note here blamed purchases_flutter 8.11.0, which was dropped from this example
# when RevenueCat went; flipping the flag on that basis fails immediately with:
#
#   A problem occurred evaluating project ':app_links'.
#   > The 'org.jetbrains.kotlin.android' plugin is no longer required for
#     Kotlin support since AGP 9.0.
#   (app_links-6.4.1/android/build.gradle)
#
# So the current blocker is app_links, and it is a THIRD-PARTY plugin again.
# roas_flutter itself is migrated: its android/build.gradle applies KGP only
# when this flag is false, and it is absent from the failure above.
#
# The cost of leaving it false is the build warning "your app uses plugins that
# apply Kotlin Gradle Plugin (KGP): roas_flutter" — accurate, because with the
# flag off we DO supply Kotlin, which is exactly what the conditional is for.
#
# Flip to true when app_links ships a built-in-Kotlin build (6.4.1 is not it).
# Re-verify by building; do not assume from the changelog.
android.builtInKotlin=false
