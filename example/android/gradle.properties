android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
#
# Left at false because purchases_flutter 8.11.0 — NOT roas_flutter — blocks it.
# Under `true`, RevenueCat's own android/build.gradle fails two ways: applying
# `kotlin-android` throws "this and base files have different roots" (its pub
# cache lives on C: while this project is on D:), and it declares no
# `compileSdk`, which AGP 9 refuses. roas_flutter is migrated and does not
# appear in either failure.
#
# Flip this to true once purchases_flutter is upgraded (10.7.0 is available) to
# complete the migration for the whole app.
android.builtInKotlin=false
