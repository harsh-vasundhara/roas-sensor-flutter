name: roas_flutter
description: Flutter bridge for the ROASSensor Android and iOS tracking SDKs (install attribution, funnel events, identity).
version: 0.1.0
homepage: https://github.com/harsh-vasundhara/roas-android-sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.roassensor.roas_flutter
        pluginClass: RoasFlutterPlugin
      ios:
        pluginClass: RoasFlutterPlugin
