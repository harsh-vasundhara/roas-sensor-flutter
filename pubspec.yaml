name: roas_flutter
description: Flutter bridge for the ROASSensor Android and iOS tracking SDKs (install attribution, funnel events, identity).
# Tracks the native SDK this wraps (com.roassensor:roas), so the plugin version
# answers "which roas-android-sdk am I on" without opening build.gradle. Bump it
# when that dependency moves, and not for plugin-only changes — adding
# play-services-ads-identifier alone did not move it, the jump to roas 0.1.4 did.
# Keep android/build.gradle and ios/roas_flutter.podspec in step.
version: 0.1.6
# This package's own repo. It pointed at roas-android-sdk — the NATIVE Android
# SDK this wraps — which sends anyone following it to a repo with no Dart in it,
# and no `ref:` that resolves as a Flutter dependency. That is the exact wrong
# turn to leave in a package whose install step is a git dependency on itself.
homepage: https://github.com/harsh-vasundhara/roas-sensor-flutter
repository: https://github.com/harsh-vasundhara/roas-sensor-flutter

# Raised from Dart 3.0 / Flutter 3.10 by the Built-in Kotlin migration: the
# `kotlin { compilerOptions { … } }` DSL in android/build.gradle needs KGP 2.x,
# which is Flutter 3.44's floor. Declaring it honestly here makes an
# incompatible consumer fail at `pub get` with a readable message, instead of
# deep inside a Gradle build with an unresolved-DSL error.
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.roassensor.roas_flutter
        pluginClass: RoasFlutterPlugin
      ios:
        pluginClass: RoasFlutterPlugin
