group 'com.roassensor.roas_flutter'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        // com.roassensor:roas is published on Maven Central as of 2026-07-28 —
        // mavenCentral() alone resolves it, no JitPack/mavenLocal workaround
        // needed anymore. mavenLocal() is kept ahead of it purely as a local-dev
        // convenience (e.g. testing an unreleased roas-android-sdk build via
        // `./gradlew :roas:publishToMavenLocal`); it's a no-op fallthrough to
        // mavenCentral() for everyone else since nothing is normally published
        // to ~/.m2.
        mavenLocal()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.roassensor.roas_flutter'
    compileSdk 34

    defaultConfig {
        // Matches the roas-android-sdk module's own floor (roas/build.gradle.kts).
        // If the host app also adds RevenueCat directly, IT needs minSdk 23 —
        // that's a constraint on the app, not on this bridge.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 0.1.0 was published to Maven Central on 2026-07-28. 0.1.1 (the
    // RoasLogLevel/handleDeepLink/setLogLevel additions) is newer than that
    // and currently only resolves from mavenLocal() (see
    // rootProject.allprojects above) — run
    // `./gradlew :roas:publishToMavenLocal` in sdk-android first. Bump this
    // back down to 0.1.0, or wait for a real 0.1.1 Central publish, if
    // that's inconvenient.
    implementation 'com.roassensor:roas:0.1.1'
}
