group 'com.roassensor.roas_flutter'
version '0.1.4'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        // No kotlin-gradle-plugin classpath, and no ext.kotlin_version pin.
        // Under Built-in Kotlin the HOST APP owns the Kotlin version (its
        // settings.gradle.kts pluginManagement block declares it), so pinning
        // one here — 1.9.24, as this did — puts a second, older KGP on the same
        // build as the app's and is exactly what Flutter is deprecating.
    }
}

rootProject.allprojects {
    repositories {
        google()
        // com.roassensor:roas is published on Maven Central — 0.1.0 since
        // 2026-07-28, 0.1.1 since 2026-08-03, 0.1.2 (device context + the
        // transient Play-referrer retry) since 2026-08-04. mavenCentral()
        // alone resolves any of them, no JitPack/mavenLocal workaround needed.
        // mavenLocal() is kept ahead of it purely as a local-dev convenience
        // (e.g. testing an unreleased roas-android-sdk build via
        // `./gradlew :roas:publishToMavenLocal`); it's a no-op fallthrough to
        // mavenCentral() for everyone else since nothing is normally
        // published to ~/.m2.
        mavenLocal()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Built-in Kotlin (Flutter 3.44+). AGP 9 applies the Kotlin plugin itself, so a
// plugin that also applies it double-applies KGP — the thing the build warns
// about and that "future versions of Flutter will fail to build".
//
// The apply stays CONDITIONAL rather than being deleted outright, because the
// host app's AGP version is independent of its Flutter version: a consumer on
// Flutter 3.44 can still be on AGP 8, where nothing would apply Kotlin for us
// and every .kt file in this bridge would simply not compile.
//
// The condition keys off `android.builtInKotlin`, which is the flag that
// actually decides whether anything else applies Kotlin for us. Two more
// obvious conditions were tried and both are wrong:
//
//   • `agpMajor < 9` (what the migration guide suggests) — AGP 9 only applies
//     Kotlin when builtInKotlin=true, and Flutter's app template still ships
//     that flag FALSE. On AGP 9 + false the apply is skipped, nothing supplies
//     Kotlin, and evaluation dies on the `kotlin {}` block below.
//   • `!plugins.hasPlugin('org.jetbrains.kotlin.android')` — built-in Kotlin
//     has not applied KGP yet at the point this script body runs, so the check
//     reads false, we apply anyway, and AGP 9 rejects it with "no longer
//     required for Kotlin support since AGP 9.0".
//
// The hasPlugin guard is kept as a second condition purely against a
// double-apply in a setup that did get there first.
def builtInKotlin = (project.findProperty('android.builtInKotlin') ?: 'false').toString().toBoolean()
if (!builtInKotlin && !project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.roassensor.roas_flutter'
    compileSdk 34

    defaultConfig {
        // Matches the roas-android-sdk module's own floor (roas/build.gradle.kts).
        // If the host app also adds RevenueCat directly, IT needs minSdk 23 —
        // that's a constraint on the app, not on this bridge.
        minSdk 21
    }

    compileOptions {
        // 17, matching the example app and Flutter's own template. The old 1.8
        // was what produced the "source value 8 is obsolete" warnings, and it
        // cannot stay: AGP fails the build outright when the Java and Kotlin
        // JVM targets disagree, and the Kotlin side must be 17 below.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Replaces the `kotlinOptions` block, which Built-in Kotlin removes. This is
// the KGP 2.x DSL, hence the Flutter 3.44 / Dart 3.12 floor in pubspec.yaml.
//
// Deferred with withId rather than called straight: whoever applies Kotlin —
// us above, or AGP's built-in support — the `kotlin` extension only exists
// afterwards, and calling it at script-body time fails with "Could not find
// method kotlin()" on the very configuration this migration is meant to fix.
plugins.withId('org.jetbrains.kotlin.android') {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    // 0.1.3 adds, over 0.1.2: Play Services version, App Set ID, the raw
    // referrer click/install timestamps, beacon signing, sessions (session id +
    // number + foreground engagement) and emulator/root signals. All of them
    // ride the install beacon automatically — the only one needing a Dart-side
    // argument is the signing secret.
    // 0.1.4 fixes two things that only a host like Flutter or a minified build
    // could hit: the activity counter that stopped firing onEnterForeground when
    // the SDK is started after the first activity (which is every Flutter app —
    // Dart main() runs inside FlutterActivity.onStart), and the missing R8 keep
    // rules that blanked app_set_id in every release build.
    // 0.1.5 is a batch from a live testing pass of this Flutter bridge (real
    // emulator + a Nokia + a Vivo V2130, plus a real ad click):
    //   * handleDeepLink was dropping every query param except rsclid
    //     (utm_source/rs_campaign/etc. never reached the backend) and outright
    //     refusing a link using a non-rsclid click id (gclid/fbclid) instead.
    //   * an OEM data-retention issue where the Vivo kept resurrecting its old
    //     vid/installReported across real uninstall+reinstall cycles, plus a
    //     beacon-queue race and a stale-queue leak that fix exposed.
    //   * a best-effort deferred-link attribution probe for already-installed
    //     users who tap an ad — nothing previously called that backend
    //     endpoint outside of a fresh install.
    //   * a fallback for installs from non-Play-Store OEM app stores (Vivo,
    //     Xiaomi, Huawei, Samsung, Amazon) via the legacy INSTALL_REFERRER
    //     broadcast — the Play Install Referrer API alone answers
    //     FEATURE_NOT_SUPPORTED for those and nothing else.
    implementation 'com.roassensor:roas:0.1.5'

    // GAID (advertising id) — the ONLY source of `device_id` on Android, which
    // is the strongest identity key an install can carry and what every
    // GAID-keyed CAPI match resolves against.
    //
    // The native SDK declares this `compileOnly` (roas/build.gradle.kts) so a
    // pure-Kotlin app is never forced to carry Play Services, and `DeviceId`
    // reads the class reflectively — which means an absent classpath entry is
    // indistinguishable at runtime from the user opting out of ad tracking. It
    // simply returns null. So without this line a Flutter app reported NO ad id
    // at all and nothing said so: no crash, no log, just a quietly weaker
    // identity graph. Whether it worked was an accident of whether the host app
    // happened to pull the artifact in transitively (Firebase and AdMob do; a
    // plain Flutter app does not).
    //
    // Declared HERE for the same reason as the App Set ID below: a Flutter app
    // is a different audience from a Kotlin one and wants the plugin to work out
    // of the box. Pure-Kotlin consumers still add the line themselves.
    //
    // The `com.google.android.gms.permission.AD_ID` permission this needs on
    // Android 12+ already ships in the native SDK's own manifest and arrives by
    // manifest merge; an app that would rather have no ad id removes it with
    // `tools:node="remove"` and the SDK degrades to referrer-only.
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // Android App Set ID — the ONLY source of `app_set_id`, which backs
    // duplicate-install / device-farm detection. The SDK reads it reflectively
    // and degrades to null when the class is absent, so without this line the
    // field is permanently blank and that whole feature is inert.
    //
    // Declared HERE rather than in roas-android-sdk on purpose. The native SDK
    // keeps Play Services `compileOnly` so a pure-Kotlin app is never forced to
    // carry a dependency it didn't ask for. A Flutter app is a different
    // audience — it wants the plugin to work out of the box — and this artifact
    // is small with no meaningful transitive weight. Pure-Kotlin consumers add
    // the same line themselves if they want the field.
    //
    // NOT an ads dependency, and it must not be used as one: Google permits the
    // App Set ID for analytics and fraud prevention and forbids it for ads
    // measurement. That is why the backend salts the hash and never makes it an
    // IdentityKey.
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
}
